server.port=8080


# =========================
# PROFILE SERVICE
# =========================
spring.cloud.gateway.server.webflux.routes[0].id=profile-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/profiles/**,/oauth2/**,/login/**


# =========================
# PRODUCT SERVICE
# =========================
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/products/**,/merchant/products/**


# =========================
# CART SERVICE
# =========================
spring.cloud.gateway.server.webflux.routes[2].id=cart-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://CART-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/cart/**


# =========================
# ORDER SERVICE
# =========================
spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/orders/**,/merchant/orders/**


# =========================
# PAYMENT SERVICE
# =========================
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/wallet/**

spring.cloud.gateway.server.webflux.routes[5].id=delivery-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://DELIVERY-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/delivery/**


spring.cloud.gateway.server.webflux.routes[6].id=admin-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/admin/**
management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,gateway
